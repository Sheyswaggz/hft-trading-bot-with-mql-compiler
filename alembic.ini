# Alembic Configuration File
# Database migration management for HFT Trading Bot

[alembic]
# Path to migration scripts directory
script_location = alembic

# Template used for generating migration file names
# Format: YYYY_MM_DD_HHMM-{rev}_{slug}
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Prepend sys.path with the current directory for imports
prepend_sys_path = .

# Version path separator; use os.pathsep for platform independence
# version_path_separator = os  # Use os.pathsep. Default configuration used for new projects.

# Set to 'true' to search source files recursively in each "version_locations" directory
# new in Alembic version 1.10
# recursive_version_locations = false

# Set to 'true' to run the environment during the 'revision' command
# Default: false
# revision_environment = false

# The output encoding used when revision files are written from script.py.mako
# output_encoding = utf-8

# Placeholder for database URL - will be overridden by env.py using environment variables
# In production, set DATABASE_URL environment variable
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Post-write hooks for code formatting after migration generation
# Uncomment and configure if using code formatters on migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100 REVISION_SCRIPT_FILENAME


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S