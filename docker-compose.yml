services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: hft-trading-bot:${VERSION:-latest}
    container_name: hft-trading-bot
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/app/src
      - PORT=8000
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge