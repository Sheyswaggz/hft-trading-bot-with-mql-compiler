---
apiVersion: v1
kind: Namespace
metadata:
  name: dev
  labels:
    name: dev
    environment: dev

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hft-trading-bot-config
  namespace: dev
  labels:
    app: hft-trading-bot
data:
  APP_ENV: "dev"
  LOG_LEVEL: "debug"
  LOG_FORMAT: "json"
  PORT: "8000"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hft-trading-bot
  namespace: dev
  labels:
    app: hft-trading-bot
    version: v0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hft-trading-bot
  template:
    metadata:
      labels:
        app: hft-trading-bot
        version: v0.1.0
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      containers:
      - name: hft-trading-bot
        image: hft-trading-bot:latest
        imagePullPolicy: IfNotPresent
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        
        envFrom:
        - configMapRef:
            name: hft-trading-bot-config
        
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
      
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi
      - name: cache
        emptyDir:
          sizeLimit: 500Mi

---
apiVersion: v1
kind: Service
metadata:
  name: hft-trading-bot
  namespace: dev
  labels:
    app: hft-trading-bot
spec:
  type: ClusterIP
  selector:
    app: hft-trading-bot
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP