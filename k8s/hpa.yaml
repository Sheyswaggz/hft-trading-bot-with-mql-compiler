apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hft-trading-bot-hpa
  namespace: production
  labels:
    app: hft-trading-bot
    environment: production
    component: autoscaling
    managed-by: kubernetes
  annotations:
    description: "HPA for HFT Trading Bot with CPU and memory-based autoscaling"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hft-trading-bot-deployment
  
  minReplicas: 3
  maxReplicas: 10
  
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
    
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max