apiVersion: v1
kind: ConfigMap
metadata:
  name: hft-trading-bot-config
  namespace: production
  labels:
    app: hft-trading-bot
    component: config
    version: v1.0.0
  annotations:
    description: "Non-sensitive configuration for HFT Trading Bot"
data:
  LOG_LEVEL: "info"
  ENVIRONMENT: "production"
  TIMEFRAME: "5m"
  MAX_POSITION_SIZE: "10000"
  ENABLE_BACKTESTING: "false"
  METRICS_PORT: "9090"
  HEALTH_CHECK_INTERVAL: "30"