apiVersion: v1
kind: Service
metadata:
  name: hft-trading-bot-service
  namespace: production
  labels:
    app: hft-trading-bot
    environment: production
    version: v1.0.0
    component: trading-bot
    managed-by: kubernetes
  annotations:
    description: "HFT Trading Bot internal load balancing service"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: hft-trading-bot
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800