name: Deploy Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - development
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Output image digest
        run: echo "Image digest ${{ steps.build.outputs.digest }}"

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'development'
    
    environment:
      name: development
      url: https://dev.trading-bot.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      
      - name: Update deployment image
        run: |
          kubectl set image deployment/hft-trading-bot-deployment \
            hft-trading-bot=${{ needs.build-and-push.outputs.image }} \
            -n development \
            --record
          
          kubectl annotate deployment/hft-trading-bot-deployment \
            kubernetes.io/change-cause="Deploy ${{ needs.build-and-push.outputs.image }} from commit ${{ github.sha }}" \
            -n development
      
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/hft-trading-bot-deployment \
            -n development \
            --timeout=10m
      
      - name: Verify health check
        run: |
          echo "Waiting for pods to be ready..."
          kubectl wait --for=condition=ready pod \
            -l app=hft-trading-bot \
            -n development \
            --timeout=5m
          
          echo "Verifying health endpoint..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://dev.trading-bot.example.com/health || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: Health check returned $STATUS, retrying..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1
      
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, initiating rollback..."
          kubectl rollout undo deployment/hft-trading-bot-deployment -n development
          kubectl rollout status deployment/hft-trading-bot-deployment -n development --timeout=5m
          echo "Rollback completed"
      
      - name: Notify Slack on success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "✅ Development Deployment Successful",
              "attachments": [{
                "color": "good",
                "fields": [
                  {"title": "Environment", "value": "Development", "short": true},
                  {"title": "Image", "value": "${{ needs.build-and-push.outputs.image }}", "short": false},
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {"title": "URL", "value": "https://dev.trading-bot.example.com", "short": false}
                ]
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      
      - name: Notify Slack on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "❌ Development Deployment Failed",
              "attachments": [{
                "color": "danger",
                "fields": [
                  {"title": "Environment", "value": "Development", "short": true},
                  {"title": "Image", "value": "${{ needs.build-and-push.outputs.image }}", "short": false},
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {"title": "Action", "value": "Rollback initiated", "short": true}
                ]
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-dev]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    
    environment:
      name: staging
      url: https://staging.trading-bot.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      
      - name: Update deployment image
        run: |
          kubectl set image deployment/hft-trading-bot-deployment \
            hft-trading-bot=${{ needs.build-and-push.outputs.image }} \
            -n staging \
            --record
          
          kubectl annotate deployment/hft-trading-bot-deployment \
            kubernetes.io/change-cause="Deploy ${{ needs.build-and-push.outputs.image }} from commit ${{ github.sha }}" \
            -n staging
      
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/hft-trading-bot-deployment \
            -n staging \
            --timeout=10m
      
      - name: Verify health check
        run: |
          echo "Waiting for pods to be ready..."
          kubectl wait --for=condition=ready pod \
            -l app=hft-trading-bot \
            -n staging \
            --timeout=5m
          
          echo "Verifying health endpoint..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://staging.trading-bot.example.com/health || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: Health check returned $STATUS, retrying..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1
      
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, initiating rollback..."
          kubectl rollout undo deployment/hft-trading-bot-deployment -n staging
          kubectl rollout status deployment/hft-trading-bot-deployment -n staging --timeout=5m
          echo "Rollback completed"
      
      - name: Notify Slack on success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "✅ Staging Deployment Successful",
              "attachments": [{
                "color": "good",
                "fields": [
                  {"title": "Environment", "value": "Staging", "short": true},
                  {"title": "Image", "value": "${{ needs.build-and-push.outputs.image }}", "short": false},
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {"title": "URL", "value": "https://staging.trading-bot.example.com", "short": false}
                ]
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      
      - name: Notify Slack on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "❌ Staging Deployment Failed",
              "attachments": [{
                "color": "danger",
                "fields": [
                  {"title": "Environment", "value": "Staging", "short": true},
                  {"title": "Image", "value": "${{ needs.build-and-push.outputs.image }}", "short": false},
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {"title": "Action", "value": "Rollback initiated", "short": true}
                ]
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
    
    environment:
      name: production
      url: https://trading-bot.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      
      - name: Update deployment image
        run: |
          kubectl set image deployment/hft-trading-bot-deployment \
            hft-trading-bot=${{ needs.build-and-push.outputs.image }} \
            -n production \
            --record
          
          kubectl annotate deployment/hft-trading-bot-deployment \
            kubernetes.io/change-cause="Deploy ${{ needs.build-and-push.outputs.image }} from commit ${{ github.sha }}" \
            -n production
      
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/hft-trading-bot-deployment \
            -n production \
            --timeout=10m
      
      - name: Verify health check
        run: |
          echo "Waiting for pods to be ready..."
          kubectl wait --for=condition=ready pod \
            -l app=hft-trading-bot \
            -n production \
            --timeout=5m
          
          echo "Verifying health endpoint..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://trading-bot.example.com/health || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: Health check returned $STATUS, retrying..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1
      
      - name: Monitor deployment
        run: |
          echo "Monitoring deployment for 120 seconds..."
          sleep 120
          
          echo "Running extended health checks..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://trading-bot.example.com/health || echo "000")
            if [ "$STATUS" -ne 200 ]; then
              echo "Health check failed with status $STATUS"
              exit 1
            fi
            echo "Health check $i passed"
            sleep 10
          done
          echo "All health checks passed"
      
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, initiating rollback..."
          kubectl rollout undo deployment/hft-trading-bot-deployment -n production
          kubectl rollout status deployment/hft-trading-bot-deployment -n production --timeout=5m
          echo "Rollback completed"
      
      - name: Create GitHub release
        if: success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: prod-${{ github.sha }}
          release_name: Production Release ${{ github.sha }}
          body: |
            ## Production Deployment
            
            **Image:** ${{ needs.build-and-push.outputs.image }}
            **Commit:** ${{ github.sha }}
            **Digest:** ${{ needs.build-and-push.outputs.digest }}
            **URL:** https://trading-bot.example.com
            
            Deployed successfully to production environment.
          draft: false
          prerelease: false
      
      - name: Notify Slack on success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "🚀 Production Deployment Successful",
              "attachments": [{
                "color": "good",
                "fields": [
                  {"title": "Environment", "value": "Production", "short": true},
                  {"title": "Image", "value": "${{ needs.build-and-push.outputs.image }}", "short": false},
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {"title": "URL", "value": "https://trading-bot.example.com", "short": false}
                ]
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      
      - name: Notify Slack on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "🚨 Production Deployment Failed",
              "attachments": [{
                "color": "danger",
                "fields": [
                  {"title": "Environment", "value": "Production", "short": true},
                  {"title": "Image", "value": "${{ needs.build-and-push.outputs.image }}", "short": false},
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {"title": "Action", "value": "Rollback initiated", "short": true}
                ]
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}